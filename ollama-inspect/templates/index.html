<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GGUF Keys & Values – Ollama Inspect</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 2rem; }
      header { margin-bottom: 1rem; }
      code { background: rgba(127,127,127,0.15); padding: 0.1rem 0.3rem; border-radius: 4px; }
      #search { padding: 0.5rem; width: min(640px, 90vw); }
      .meta { color: #888; margin: 0.25rem 0 1rem; }
      ul { list-style: none; padding: 0; }
      li { padding: 0.5rem 0; border-bottom: 1px solid rgba(127,127,127,0.2); }
      .row { display: grid; grid-template-columns: 28% 72%; gap: 1rem; align-items: start; }
      .k { white-space: pre-wrap; word-break: break-word; }
      .v { white-space: pre-wrap; word-break: break-word; }
      .preview { color: #555; }
      .actions { margin-top: 0.25rem; }
      button { font: inherit; padding: 0.1rem 0.4rem; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>GGUF Keys & Values</h1>
      <div class="meta">
        File: <code>{{ model_path }}</code> · Total keys: <strong id="count">{{ keys_count }}</strong>
        · <a href="/api/items" target="_blank" rel="noopener">JSON</a>
      </div>
      <input id="search" type="search" placeholder="Filter keys or values... (type to filter)" autofocus />
    </header>

    <ul id="keys">
      {% for k, preview, full in items %}
        <li class="key-item">
          <div class="row">
            <div class="k"><code>{{ k }}</code></div>
            <div class="v">
              <div class="preview">{{ preview }}</div>
              <div class="full hidden"><pre>{{ full }}</pre></div>
              <div class="actions"><button class="toggle">Expand</button></div>
            </div>
          </div>
        </li>
      {% endfor %}
    </ul>

    <script>
      const search = document.getElementById('search');
      const items = Array.from(document.querySelectorAll('.key-item'));
      const count = document.getElementById('count');
      function applyFilter() {
        const q = search.value.toLowerCase();
        let visible = 0;
        for (const li of items) {
          const text = li.textContent.toLowerCase();
          const show = !q || text.includes(q);
          li.style.display = show ? '' : 'none';
          if (show) visible++;
        }
        count.textContent = visible;
      }
      search.addEventListener('input', applyFilter);

      // Expand/collapse per item
      for (const li of items) {
        const btn = li.querySelector('button.toggle');
        const full = li.querySelector('.full');
        const preview = li.querySelector('.preview');
        if (!btn || !full || !preview) continue;
        btn.addEventListener('click', () => {
          const isHidden = full.classList.contains('hidden');
          if (isHidden) {
            full.classList.remove('hidden');
            preview.classList.add('hidden');
            btn.textContent = 'Collapse';
          } else {
            full.classList.add('hidden');
            preview.classList.remove('hidden');
            btn.textContent = 'Expand';
          }
        });
      }
    </script>
  </body>
  </html>
